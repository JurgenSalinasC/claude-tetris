<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Aplica el tema guardado antes del primer render para evitar parpadeo.
    if (localStorage.getItem('tetris-theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section hidden" id="combo-section">
          <span class="label">COMBO <span class="badge hidden" id="b2b-badge">B2B</span></span>
          <span class="value combo-value" id="combo-value">x1</span>
        </div>

        <div class="panel-section hidden" id="objective-section">
          <span class="label">OBJETIVO</span>
          <span class="objective-desc" id="objective-desc"></span>
          <span class="objective-progress" id="objective-progress"></span>
        </div>

        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UPS</span>
          <div class="powerups" id="powerups">
            <div class="slot empty"></div>
            <div class="slot empty"></div>
            <div class="slot empty"></div>
          </div>
          <span class="freeze" id="freeze-indicator"></span>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar" id="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
          <span class="ability-status" id="ability-status"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> hold</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> power-up</li>
          </ul>
          <button id="menu-btn">Menú</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="menu" class="overlay hidden">
      <div class="overlay-box menu-box">
        <p class="menu-title">TETRIS</p>
        <button id="menu-classic-btn" class="menu-mode-btn">Clásico</button>
        <button id="menu-challenge-btn" class="menu-mode-btn">Desafío</button>
        <div class="challenge-list hidden" id="challenge-list"></div>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box ability-box">
        <p class="menu-title">ELIGE UNA HABILIDAD</p>
        <div class="ability-cards" id="ability-cards"></div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
